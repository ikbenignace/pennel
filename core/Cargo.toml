[package]
name = "pennel-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "pennel_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
uniffi = { version = "0.32.2", features = ["cli"] }
ureq = "3.5.0"
uuid = { version = "1.29.0", features = ["v7"] }
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false }

[features]
vulkan = ["transcribe-cpp/vulkan"]

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
