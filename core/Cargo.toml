[package]
name = "pennel-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "pennel_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uniffi = { version = "0.32.2", features = ["cli"] }
ureq = "3.5.0"
uuid = { version = "1.29.0", features = ["v7"] }
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["metal"] }

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
