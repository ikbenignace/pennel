[package]
name = "pennel-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Pennel for Windows and Linux"

[[bin]]
name = "pennel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
pennel-core = { path = "../../../core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
arboard = "3.7"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(not(windows))'.dependencies]
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5.3"
cpal = { version = "0.18", features = ["pulseaudio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[features]
vulkan = ["pennel-core/vulkan"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
