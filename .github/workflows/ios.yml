name: ios

on:
  push:
    branches: [main]
    paths: &paths
      - "core/**"
      - "apps/ios/**"
      - "scripts/build-core-ios.sh"
      - "Makefile"
      - "assets/brand/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # The iOS build compares its generated bindings with the Mac build's.
      - name: Mac core bindings
        run: make core
      - name: Pick an available iPhone simulator
        run: |
          name=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*[^( ]\) (.*/\1/p' | head -n 1)
          test -n "$name"
          echo "IOS_DESTINATION=platform=iOS Simulator,name=$name" >> "$GITHUB_ENV"
      - name: Build and test
        run: make ios-test
      - name: Unsigned device build
        run: make ios
