name: desktop

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Rust lint
        run: cargo clippy --manifest-path core/Cargo.toml --lib --tests -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml --lib
